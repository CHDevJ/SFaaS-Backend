# Use only with --spring.profiles.active=backend-b,manual-test
spring.config.import=file:./secrets/manual-test.properties
server.address=127.0.0.1
server.port=8081
spring.datasource.url=jdbc:mysql://127.0.0.1:3308/stf_b_manual?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
spring.datasource.username=stf_b_manual
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380
spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false
stf.backend-b.ingestion-enabled=false
stf.telegram.polling-enabled=${TELEGRAM_POLLING_ENABLED:false}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operations-sorter=alpha
springdoc.paths-to-match=/api/v1/**

# Short sweep for observable logout/expiry checks in the dedicated manual profile.
stf.websocket.session-check-interval-ms=1000
