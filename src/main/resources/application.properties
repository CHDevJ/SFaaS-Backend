spring.application.name=stf

# Database schema is managed only by Flyway migration scripts.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Redis stores only the latest equipment state and other short-lived data.
# Persistent history remains in MySQL.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Keep the default exposure small. Add more endpoints only when needed.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# API documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
