spring.application.name=stf

# Optional developer-only secret file outside the classpath and Git.
# Run scripts/Setup-LocalJwt.ps1 once; environment variables take precedence.
spring.config.import=optional:file:./secrets/jwt-local.properties

# Database schema is managed only by Flyway migration scripts.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Redis stores only the latest equipment state and other short-lived data.
# Persistent history remains in MySQL.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Access token signing key from JWT_SECRET (environment or ignored local import).
# At least 32 bytes; startup still fails when no valid key is supplied.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:stf}

# Telegram bot name used to build the signup connection link (https://t.me/<bot>?start=<token>).
# Signup fails until it is set.
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
# Bot token used to send messages such as temporary passwords. Secret: environment variable only.
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}

# Keep the default exposure small. Add more endpoints only when needed.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# API documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
