# Activate with --spring.profiles.active=local,backend-b after applying Flyway V1/V2/V3.
stf.backend-b.enabled=true
stf.auth.jwt-secret=${JWT_SECRET}
stf.auth.issuer=${JWT_ISSUER:stf}
stf.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
stf.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
stf.websocket.allowed-origins=${STF_WS_ORIGINS:http://localhost:5173,http://192.168.20.11:5173}
