# Activate with --spring.profiles.active=local,backend-b after applying Flyway V1 through V6.
stf.backend-b.enabled=true
stf.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
# Opt in on only one backend instance for each shared bot.
stf.telegram.polling-enabled=${TELEGRAM_POLLING_ENABLED:false}
stf.websocket.allowed-origins=${STF_WS_ORIGINS:http://localhost:5173,http://192.168.20.11:5173}

# v7: choose exactly one stock source.
stf.inventory.source=${STF_INVENTORY_SOURCE:DEMO_PRODUCTION}
stf.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
