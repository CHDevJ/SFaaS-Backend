# Copy to application-local.properties only when running without Docker Compose.
# application-local.properties is ignored by Git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stf?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USER:stf_user}
spring.datasource.password=${DB_PASSWORD:stf_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.docker.compose.enabled=false
