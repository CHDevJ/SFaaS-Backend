# Unit and context tests must run without Docker or a local MySQL installation.
spring.datasource.url=jdbc:h2:mem:stf;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.docker.compose.enabled=false

# Test-only values. Never reuse them outside tests.
app.jwt.secret=test-only-jwt-secret-key-0123456789-abcdef
app.jwt.issuer=stf
app.telegram.bot-username=stf_test_bot
