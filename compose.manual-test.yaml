# Dedicated local manual-test environment. Existing compose.yaml is unaffected.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stf_b_manual
      MYSQL_USER: stf_b_manual
      MYSQL_PASSWORD: ${MANUAL_DB_PASSWORD:?Run Start-ManualTest.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MANUAL_DB_ROOT_PASSWORD:?Run Start-ManualTest.ps1 first}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - manual-mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost --silent']
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  manual-mysql-data:
