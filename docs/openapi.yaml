          $ref: "#/components/responses/Unauthorized"
      description: FR0903~0907 조립 정지 예측. 같은 설비·항목 종료 CRITICAL 평균과 표본 수 제공. 0건이면
        복구·여유·부족·손실 null, 소진·정지 예상 유지. 생산량은 HOURLY_OUTPUT, 단가는 UNIT_PRICE. 60초 및
        설비 상태변경 재계산.
  /inventory:
    get:
      tags:
        - Inventory
      operationId: getInventory
      summary: 라인별 현재 재고 조회
      x-api-id: INV-001
      x-requirement-ids:
