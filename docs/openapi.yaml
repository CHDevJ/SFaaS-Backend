          in: query
          description: 미지정 시 전체 라인
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Identifier"
          style: form
          explode: false
      responses:
        "200":
          description: 시각별 라인 재고
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryHistoryResponse"
