      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: Node-RED 내부 수집 전용 키. 90일마다 회전하며 현재 키와 직전 키를 24시간 중첩 허용한다.
      x-proposed: true
    telegramWebhookSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: 봇 Webhook 등록 시 서버 환경변수로 지정한 비밀값
  parameters:
    Page:
      name: page
      in: query
      description: 0부터 시작
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
        example: 2026-11-16T00:00:00+09:00
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
        example: 2026-11-16T23:59:59+09:00
    FromOptional:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    ToOptional:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    LineId:
      name: lineId
      in: query
      schema:
        $ref: "#/components/schemas/Identifier"
    EquipmentId:
      name: equipmentId
      in: query
      schema:
        $ref: "#/components/schemas/Identifier"
    CommunicationStatus:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/CommunicationStatus"
    LineIdPath:
      name: lineId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ProcessIdPath:
      name: processId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    EquipmentIdPath:
      name: equipmentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    AlarmIdPath:
      name: alarmId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    DataItemIdPath:
      name: dataItemId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SignupRequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
  responses:
    ValidationError:
      description: 요청값 형식 또는 필수값 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: 입력값을 확인해 주세요.
    Unauthorized:
      description: 로그인 또는 토큰 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: AUTH_TOKEN_INVALID
              message: 다시 로그인해 주세요.
    Forbidden:
      description: 접근 권한 부족
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: AUTH_PERMISSION_DENIED
              message: 접근 권한이 없습니다.
    NotFound:
      description: 요청한 데이터 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 중복 또는 현재 상태 충돌
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BusinessRuleViolation:
      description: 업무규칙 위반
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Identifier:
      type: integer
      format: int64
      minimum: 1
      description: 최종 ERD의 BIGINT 자동 증가 식별자
      example: 1
    Permission:
      type: string
      enum:
        - ADMIN
        - USER
      description: ADMIN=관리자, USER=사용자. 직접 저장·권한 검사하며 직책에서 파생하지 않는다.
      readOnly: false
    AccountStatus:
      type: string
      enum:
        - PENDING_APPROVAL
        - ACTIVE
        - PASSWORD_CHANGE_REQUIRED
      x-enum-varnames:
        - 승인대기
        - 사용
        - 비밀번호변경필요
    EquipmentStatus:
      type: string
      enum:
        - RUNNING
        - IDLE
        - CAUTION
        - FAULT
        - COMMUNICATION_LOST
      x-enum-varnames:
        - 가동
        - 대기
        - 주의
        - 고장
        - 통신끊김
    DataValueType:
      type: string
      enum:
        - MEASUREMENT
        - STATE
        - CUMULATIVE
      x-enum-varnames:
        - 측정값
        - 상태값
        - 누적값
    AlarmGrade:
      type: string
      enum:
        - CAUTION
        - CRITICAL
      x-enum-varnames:
        - 주의
        - 경보
    AlarmValueStatus:
      type: string
      enum:
        - ABNORMAL
        - RECOVERED
      x-enum-varnames:
        - 이상
        - 값정상복귀
    AlarmProcessStatus:
      type: string
      enum:
        - ACTIVE
        - CLOSED
      description: 발생 중 / 조치 완료 종료. 값 정상 복귀는 processStatus를 바꾸지 않는다.
    CommunicationStatus:
      type: string
      enum:
        - CONNECTED
        - DISCONNECTED
      x-enum-varnames:
        - 연결
        - 끊김
    HeaderCommunicationStatus:
      type: string
      enum:
        - ALL_NORMAL
        - PARTIAL_DISCONNECTED
        - ALL_DISCONNECTED
      x-enum-varnames:
        - 전체정상
        - 일부끊김
        - 전체끊김
    ThresholdDirection:
      type: string
      enum:
        - ABOVE
        - BELOW
      description: 기준 이상 또는 기준 이하에서 알람을 발생시키는 제안 코드
      x-proposed: true
    DeliveryResult:
      type: string
      enum:
        - SUCCESS
        - FAILURE
    PageMeta:
      type: object
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: 입력값을 확인해 주세요.
        details:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
        traceId:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          $ref: "#/components/schemas/ErrorDetail"
    LoginRequest:
      type: object
      required:
        - loginId
        - password
      properties:
        loginId:
          type: string
          minLength: 4
          maxLength: 20
          pattern: ^[a-z0-9]{4,20}$
          example: parkjh
          description: 영문 소문자와 숫자만 허용하는 로그인 아이디
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: ^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,64}$
          writeOnly: true
          description: 영문·숫자·특수문자를 각각 1개 이상 포함
    CurrentUser:
      type: object
      required:
        - userId
        - loginId
        - name
        - permission
        - accountStatus
        - lastLoginAt
      properties:
        userId:
          $ref: "#/components/schemas/Identifier"
        loginId:
          type: string
          minLength: 4
          maxLength: 20
        name:
          type: string
          maxLength: 100
        telegramConnected:
          type: boolean
        permission:
          $ref: "#/components/schemas/Permission"
        accountStatus:
          $ref: "#/components/schemas/AccountStatus"
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    LoginData:
      allOf:
        - $ref: "#/components/schemas/CurrentUser"
        - type: object
          required:
            - accessToken
            - tokenType
            - expiresAt
          properties:
            accessToken:
              type: string
              readOnly: true
            tokenType:
              type: string
              enum:
                - Bearer
            expiresAt:
              type: string
              format: date-time
      description: Refresh Token은 Set-Cookie(stfRefreshToken, HttpOnly, Secure,
        SameSite=Strict, Path=/api/v1/auth, Max-Age=604800)로만 전달.
        accountStatus=PASSWORD_CHANGE_REQUIRED면 auth/me,password,logout 외 업무
        API는 403.
    RefreshTokenRequest:
      type: object
      description: 브라우저가 아닌 클라이언트용 대체 입력. 브라우저는 HttpOnly 쿠키를 사용한다.
      properties:
        refreshToken:
          type: string
          writeOnly: true
    TokenData:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAt
      properties:
        accessToken:
          type: string
          readOnly: true
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          type: string
          format: date-time
    TokenResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/TokenData"
    SignupRequest:
      type: object
      required:
        - loginId
        - password
        - name
      properties:
        loginId:
          type: string
          minLength: 4
          maxLength: 20
          pattern: ^[a-z0-9]{4,20}$
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: ^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,64}$
          writeOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
    Signup:
      type: object
      required:
        - requestId
        - loginId
        - name
        - accountStatus
        - requestedAt
        - telegramLink
      properties:
        requestId:
          $ref: "#/components/schemas/Identifier"
        loginId:
          type: string
        name:
          type: string
        telegramLink:
          $ref: "#/components/schemas/TelegramLink"
        accountStatus:
          $ref: "#/components/schemas/AccountStatus"
        requestedAt:
          type: string
          format: date-time
    SignupResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/Signup"
    PasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: ^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,64}$
          writeOnly: true
    LoginResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/LoginData"
    CurrentUserResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/CurrentUser"
    CommunicationSummary:
      type: object
      required:
        - status
        - totalEquipmentCount
        - disconnectedEquipmentCount
      properties:
        status:
          $ref: "#/components/schemas/HeaderCommunicationStatus"
        totalEquipmentCount:
          type: integer
          minimum: 0
        disconnectedEquipmentCount:
          type: integer
          minimum: 0
        allDisconnectedSince:
          type: string
          format: date-time
          nullable: true
    CommunicationSummaryResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/CommunicationSummary"
    CommunicationEquipment:
      type: object
      required:
        - equipmentId
        - equipmentCode
        - equipmentName
        - lineName
        - communicationMethod
        - status
        - lastReceivedAt
        - todayDisconnectionCount
        - todayDisconnectionMinutes
      properties:
        equipmentId:
          $ref: "#/components/schemas/Identifier"
        equipmentCode:
          type: string
          maxLength: 100
        equipmentName:
          type: string
          maxLength: 200
        lineName:
          type: string
          maxLength: 100
        communicationMethod:
          type: string
          maxLength: 100
        status:
          $ref: "#/components/schemas/CommunicationStatus"
        lastReceivedAt:
          type: string
          format: date-time
        disconnectedSince:
          type: string
          format: date-time
          nullable: true
        todayDisconnectionCount:
          type: integer
          minimum: 0
        todayDisconnectionMinutes:
          type: integer
          minimum: 0
          description: 분
    CommunicationPageData:
      type: object
      required:
        - summary
        - items
      properties:
        summary:
          $ref: "#/components/schemas/CommunicationSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommunicationEquipment"
    CommunicationPageResponse:
      type: object
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/CommunicationPageData"
        meta:
          $ref: "#/components/schemas/PageMeta"
    LineSummary:
      type: object
      required:
        - lineId
        - lineName
        - displayOrder
        - lineType
      properties:
        lineId:
          $ref: "#/components/schemas/Identifier"
        lineName:
          type: string
          maxLength: 100
        displayOrder:
          type: integer
          minimum: 1
        lineType:
          $ref: "#/components/schemas/LineType"
    LineListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/LineSummary"
    ProcessSummary:
      type: object
      required:
        - processId
        - processName
        - processOrder
        - hasAbnormalEquipment
      properties:
        processId:
          $ref: "#/components/schemas/Identifier"
        processName:
          type: string
          maxLength: 100
        processOrder:
          type: integer
          minimum: 1
        hasAbnormalEquipment:
          type: boolean
    ProcessListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProcessSummary"
    EquipmentStatusCount:
      type: object
      required:
        - status
        - count
      properties:
        status:
          $ref: "#/components/schemas/EquipmentStatus"
        count:
          type: integer
          minimum: 0
    CurrentDataItem:
      type: object
      required:
        - dataItemId
        - dataItemName
        - valueType
        - value
        - measuredAt
      properties:
        dataItemId:
          $ref: "#/components/schemas/Identifier"
        dataItemName:
          type: string
          maxLength: 100
        valueType:
          $ref: "#/components/schemas/DataValueType"
        value:
          oneOf:
            - type: number
            - type: string
        displayValue:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
          maxLength: 30
        valueStatus:
          type: string
          enum:
            - NORMAL
            - CAUTION
            - CRITICAL
            - null
          nullable: true
        cautionThreshold:
          type: number
          nullable: true
        criticalThreshold:
          type: number
          nullable: true
        measuredAt:
          type: string
          format: date-time
    AbnormalMeasurement:
      type: object
      required:
        - dataItemId
        - dataItemName
        - currentValue
        - valueStatus
      properties:
        dataItemId:
          $ref: "#/components/schemas/Identifier"
        dataItemName:
          type: string
        currentValue:
          type: number
        unit:
          type: string
          nullable: true
        valueStatus:
          type: string
          enum:
            - CAUTION
            - CRITICAL
        threshold:
          type: number
    EquipmentSummary:
      type: object
      required:
        - equipmentId
        - equipmentCode
        - equipmentName
        - lineId
        - lineName
        - processId
        - processName
        - processOrder
        - status
        - statusStartedAt
        - activeAlarmCount
        - lineType
      properties:
        equipmentId:
          $ref: "#/components/schemas/Identifier"
        equipmentCode:
          type: string
          maxLength: 100
        equipmentName:
          type: string
          maxLength: 200
        lineId:
          $ref: "#/components/schemas/Identifier"
        lineName:
          type: string
        processId:
          $ref: "#/components/schemas/Identifier"
        processName:
          type: string
        processOrder:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/EquipmentStatus"
        statusStartedAt:
          type: string
          format: date-time
        activeAlarmCount:
          type: integer
          minimum: 0
        mainMeasurements:
          type: array
          items:
            $ref: "#/components/schemas/CurrentDataItem"
        abnormalMeasurements:
          type: array
          items:
            $ref: "#/components/schemas/AbnormalMeasurement"
        lineType:
          $ref: "#/components/schemas/LineType"
    ProcessEquipmentResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentSummary"
    EquipmentLayoutData:
      type: object
      required:
        - statusCounts
        - equipment
      properties:
        statusCounts:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentStatusCount"
        equipment:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentSummary"
        processGroups:
          type: array
          items:
            type: object
            required:
              - processId
              - lineId
              - processOrder
              - equipmentCount
              - abnormalEquipmentCount
              - equipmentIds
            properties:
              processId:
                $ref: "#/components/schemas/Identifier"
              lineId:
                $ref: "#/components/schemas/Identifier"
              processOrder:
                type: integer
                minimum: 1
              equipmentCount:
                type: integer
                minimum: 0
              abnormalEquipmentCount:
                type: integer
                minimum: 0
              equipmentIds:
                type: array
                items:
                  $ref: "#/components/schemas/Identifier"
        suggestedEquipmentId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: FAULT/CAUTION 중 가장 최근 상태 변경 설비. 없으면 null.
    EquipmentLayoutResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/EquipmentLayoutData"
    EquipmentBasicInfo:
      type: object
      required:
        - equipmentId
        - equipmentCode
        - equipmentName
        - equipmentType
        - lineId
        - lineName
        - processId
        - processName
        - processOrder
        - communicationMethod
      properties:
        equipmentId:
          $ref: "#/components/schemas/Identifier"
        equipmentCode:
          type: string
        equipmentName:
          type: string
        equipmentType:
          type: string
        serialNumber:
          type: string
          nullable: true
        lineId:
          $ref: "#/components/schemas/Identifier"
        lineName:
          type: string
        processId:
          $ref: "#/components/schemas/Identifier"
        processName:
          type: string
        processOrder:
          type: integer
        communicationMethod:
          type: string
        photoUrl:
          type: string
          format: uri
          nullable: true
        registeredAt: *a5
    EquipmentDetailData:
      type: object
      required:
        - basicInfo
        - status
        - statusStartedAt
        - lastReceivedAt
        - measurements
        - stateValues
        - cumulativeValues
      properties:
        basicInfo:
          $ref: "#/components/schemas/EquipmentBasicInfo"
        status:
          $ref: "#/components/schemas/EquipmentStatus"
        statusStartedAt:
          type: string
          format: date-time
        lastReceivedAt:
          type: string
          format: date-time
        delayed:
          type: boolean
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/CurrentDataItem"
        stateValues:
          type: array
          items:
            $ref: "#/components/schemas/CurrentDataItem"
        cumulativeValues:
          type: array
          items:
            $ref: "#/components/schemas/CurrentDataItem"
    EquipmentDetailResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/EquipmentDetailData"
    DataItemListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: "#/components/schemas/CurrentDataItem"
    MeasurementPoint:
      type: object
      required:
        - measuredAt
        - value
      properties:
        measuredAt:
          type: string
          format: date-time
        value:
          type: number
          nullable: true
          description: 미수신 구간은 null. STATE 0/1, CUMULATIVE 0 이상 정수
    AlarmMarker:
      type: object
      required:
        - alarmId
        - occurredAt
        - value
        - grade
      properties:
        alarmId:
          $ref: "#/components/schemas/Identifier"
        occurredAt:
          type: string
          format: date-time
        value:
          type: number
        grade:
          $ref: "#/components/schemas/AlarmGrade"
    DisconnectionInterval:
      type: object
      required:
        - startedAt
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
    MeasurementSeriesData:
      type: object
      required:
        - equipmentId
