openapi: 3.0.3
info:
  title: STF Save The Factory API
  version: 7.0.0
  license:
    name: Internal Project Use Only
    url: https://sfaas5-team.atlassian.net/wiki/spaces/SF5
  description: 2026-11-17 최종 재수정 자료 5개(요구사항75·NFR13·IFR4, 화면설계76쪽, HTML/PNG 각72개)와
    Confluence 조립 정지 예측 결정 2판을 반영한 구현 계약. 문서 개정이며 실행 코드의 구현 완료를 뜻하지 않는다.
  x-specification-status: approved-project-proposal
x-recovery-estimation:
  requirementId: FR0905
  ruleId: BR-RECOVERY-001
  source: 조립 정지 예측 결정 2판
  duration: closedAt - occurredAt
  groupBy:
    - equipmentId
    - dataItemId
  eligibleHistory: 현재 고장 발생 전 종료된 CRITICAL 알람 중 유효한 비음수 조치시간
  minimumRecords: 1
  returnFields:
    - repairHistoryCount
    - averageRepairMinutes
  zeroHistory:
    repairHistoryCount: 0
    averageRepairMinutes: null
    recoveryExpectedAt: null
    marginMinutes: null
    marginStatus: null
    shortageMinutes: null
    expectedLossAmount: null
  fallbackAllowed: false
  recoveryExpectedAt: 고장 발생 시각 + 같은 설비·항목 종료 경보 조치시간 평균
servers:
  - url: /api/v1
    description: 사용자 REST API
tags:
  - name: Auth
    description: 로그인과 권한
  - name: Communication
    description: 설비 통신 상태
  - name: Overview
    description: 종합현황
  - name: Equipment
    description: 설비 조회와 모니터링
  - name: Inventory
    description: 재고와 조립 정지 예측
  - name: Alarm
    description: 알람 조회와 처리
  - name: Statistics
    description: 이력과 통계
  - name: MasterData
    description: 설비관리 기준정보
  - name: SystemSetting
    description: 시스템 판정과 계산 설정
  - name: SystemUser
    description: 계정 관리
  - name: Telegram
    description: 텔레그램 본인 연결과 전송
  - name: Audit
    description: 변경 이력
  - name: Internal
    description: Node-RED 내부 수집
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: 로그인
      security: []
      x-api-id: AUTH-001
      x-requirement-ids:
        - FR0101
      x-nfr-ids:
        - NFR01
        - NFR02
      x-interface-ids: []
      x-business-rule-ids:
        - BR-AUTH-001
      x-test-ids:
        - TC-AUTH-001-01
        - TC-AUTH-001-02
      x-permissions:
        - ANONYMOUS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: Access/Refresh Token 갱신
      description: HttpOnly Secure SameSite=Strict 쿠키의 Refresh Token을 회전하고 이전 토큰을 폐기한다.
      security: []
      x-api-id: AUTH-002
      x-requirement-ids:
        - FR0102
      x-nfr-ids:
        - NFR02
      x-interface-ids: []
      x-business-rule-ids:
        - BR-AUTH-002
      x-test-ids:
        - TC-AUTH-002-01
        - TC-AUTH-002-02
      x-permissions:
        - ANONYMOUS
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: 로그아웃과 현재 Access Token 폐기
      x-api-id: AUTH-003
      x-requirement-ids:
        - FR0104
      x-nfr-ids:
        - NFR02
      x-interface-ids: []
      x-business-rule-ids:
        - BR-AUTH-003
      x-test-ids:
        - TC-AUTH-003-01
        - TC-AUTH-003-02
      x-permissions:
        - ADMIN
        - USER
      responses:
        "204":
          description: 로그아웃 성공
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: 로그인 사용자 정보 조회
      description: 로그인 사용자와 성공한 최종 로그인 시각을 반환한다.
      x-api-id: AUTH-004
      x-requirement-ids:
        - FR0105
      x-nfr-ids:
        - NFR02
        - NFR06
      x-interface-ids: []
      x-business-rule-ids:
        - BR-AUTH-004
      x-test-ids:
        - TC-AUTH-004-01
        - TC-AUTH-004-02
      x-permissions:
        - ADMIN
        - USER
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/signups:
    post:
      tags:
        - Auth
      operationId: signup
      summary: 회원가입 신청
      security: []
      x-api-id: AUTH-005
      x-requirement-ids:
        - FR0106
      x-nfr-ids:
        - NFR02
        - NFR06
      x-interface-ids: []
      x-business-rule-ids:
        - BR-AUTH-005
      x-test-ids:
        - TC-AUTH-005-01
        - TC-AUTH-005-02
      x-permissions:
        - ANONYMOUS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 승인 대기 회원가입 신청 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/me/password:
    put:
      tags:
        - Auth
      operationId: changeMyPassword
      summary: 본인 비밀번호 변경
      description: 변경 성공 시 현재 세션을 포함한 기존 토큰을 모두 폐기한다.
      x-api-id: AUTH-006
      x-requirement-ids:
        - FR0108
      x-nfr-ids:
        - NFR02
        - NFR06
      x-interface-ids: []
      x-business-rule-ids:
        - BR-AUTH-006
      x-test-ids:
        - TC-AUTH-006-01
        - TC-AUTH-006-02
      x-permissions:
        - ADMIN
        - USER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: 비밀번호 변경 및 기존 토큰 폐기 성공
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /communications:
    get:
      tags:
        - Communication
      operationId: getCommunications
      summary: 설비별 통신 현황 조회
      description: todayDisconnectionCount DESC, todayDisconnectionMinutes DESC,
        equipmentId ASC 고정 정렬. 연결 0대/전체 0대는 ALL_NORMAL과 0건으로 반환한다.
      x-api-id: COM-001
      x-requirement-ids:
        - FR0203
        - FR0204
      x-nfr-ids:
        - NFR03
        - NFR04
      x-interface-ids:
        - IFR04
      x-business-rule-ids:
        - BR-COM-001
      x-test-ids:
        - TC-COM-001-01
        - TC-COM-001-02
      x-permissions:
        - ADMIN
        - USER
      parameters:
        - $ref: "#/components/parameters/LineId"
        - $ref: "#/components/parameters/CommunicationStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 통신 집계와 설비별 통신 현황
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /communications/summary:
    get:
      tags:
        - Communication
      operationId: getCommunicationSummary
      summary: 헤더 통신 상태 조회
      x-api-id: COM-002
      x-requirement-ids:
