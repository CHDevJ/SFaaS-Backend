      x-nfr-ids:
        - NFR03
      x-interface-ids:
        - IFR04
      x-business-rule-ids:
        - BR-COM-002
      x-test-ids:
        - TC-COM-002-01
        - TC-COM-002-02
      x-permissions:
        - ADMIN
        - USER
      responses:
        "200":
          description: 전체 정상, 일부 끊김 또는 전체 끊김 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationSummaryResponse"
        "401":
