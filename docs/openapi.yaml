x-websocket:
  endpoint: /ws
  protocol: STOMP
  proposed: true
  authentication: Bearer JWT in STOMP CONNECT header
  session-authorization:
    checks: [CONNECT, SUBSCRIBE, outbound-message, periodic-idle-check]
    idle-check-interval-ms: 10000
    invalid-session-close-code: 1008
    description: 만료·폐기·비활성 계정은 전송을 거절하고 연결을 종료한다. 재발급된 JWT로 다시 CONNECT한다.
  heartbeatSeconds: 10
  reconnect: exponential backoff, then refetch current screen REST APIs
  reconnectMaximumSeconds: 30
  topics:
    - {destination: '/topic/equipment-status', requirementIds: [FR0302, FR1501], schema: {$ref: '#/components/schemas/EquipmentStatusEvent'}}
    - {destination: '/topic/measurements/{equipmentId}', requirementIds: [FR0201, FR1501], schema: {$ref: '#/components/schemas/MeasurementEvent'}}
    - {destination: '/topic/alarms', requirementIds: [FR0501, FR0601, FR1501], schema: {$ref: '#/components/schemas/AlarmChangedEvent'}}
    - {destination: '/topic/alarm-counts', requirementIds: [FR0502, FR1501], schema: {$ref: '#/components/schemas/AlarmCountEvent'}}
    - {destination: '/topic/inventory', requirementIds: [FR0902, FR1501], schema: {$ref: '#/components/schemas/InventoryChangedEvent'}}
    - {destination: '/topic/alarm-effects/{alarmId}', requirementIds: [FR0608, FR1501], schema: {$ref: '#/components/schemas/AlarmEffectEvent'}}
    - {destination: '/user/queue/notifications', requirementIds: [FR0501, FR0504, FR0505, FR0508], schema: {$ref: '#/components/schemas/UserNotificationEvent'}}
x-mqtt:
  springBootDirectSubscription: false
  proposed: true
  flow: equipment/PLC -> MQTT/Modbus/OPC UA -> Node-RED -> HTTP REST -> Spring Boot
  topics:
    - {topic: 'stf/equipment/{equipmentCode}/values', qos: 1, retained: false, interfaceId: IFR01}
  collectionIntervalSeconds: 3
  messageShape: equipmentCode, measuredAt, messageId, values[]
  communicationTimeoutSeconds: 30
  productionCounter:
    dataItemCode: prod_count
    valueType: CUMULATIVE
