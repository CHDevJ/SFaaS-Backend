      responses:
        "200":
          description: 라인별 소진 예측과 대표 조립 정지 예측
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssemblyStopForecastResponse"
              examples:
                noRecoveryHistory:
                  summary: 과거 이력0건, 정지예상은 유지
                  value:
                    success: true
                    data:
                      representativeLineId: 1
                      earliestAssemblyStopExpectedAt: 2026-11-17T10:50:00+09:00
                      calculatedAt: 2026-11-17T10:00:00+09:00
                      lines:
                        - lineId: 1
                          lineName: 외륜 라인
                          lineType: PART
                          currentInventory: 300
                          netConsumptionPerMinute: 6
                          remainingMinutes: 50
                          stage: MAINTAIN
                          assemblyStopExpectedAt: 2026-11-17T10:50:00+09:00
                          sourceEquipmentId: 4
                          activeAlarmId: 1
                          recoveryExpectedAt: null
                          marginMinutes: null
                          marginStatus: null
                          hourlyProduction: 360
                          unitPrice: 50000
                          expectedLossAmount: null
                          repairHistoryCount: 0
                          averageRepairMinutes: null
                          shortageMinutes: null
                          unitPriceConfigured: true
                          forecastStatus: NO_RECOVERY_HISTORY
                          stageThresholds:
                            &a1
                            inventoryWarningMinutes: 30
                            inventoryDangerMinutes: 10
                fiveRecoveryRecords:
                  summary: 5건 평균70분, 부족20분, 손실600만원(예시)
                  value:
                    success: true
                    data:
                      representativeLineId: 1
                      earliestAssemblyStopExpectedAt: 2026-11-17T10:50:00+09:00
                      calculatedAt: 2026-11-17T10:00:00+09:00
                      lines:
                        - lineId: 1
                          lineName: 외륜 라인
                          lineType: PART
                          currentInventory: 300
                          netConsumptionPerMinute: 6
                          remainingMinutes: 50
                          stage: MAINTAIN
                          assemblyStopExpectedAt: 2026-11-17T10:50:00+09:00
