        - NO_DEPLETION
        - NO_RECOVERY_HISTORY
        - INSUFFICIENT_DATA
      description: NO_DEPLETION=소비<=공급으로 소진 없음. NO_RECOVERY_HISTORY=소진 예측은 있으나 동일
        설비·항목 종료 경보0건. INSUFFICIENT_DATA=재고/카운터/설정 등 필수 입력 부족. 복수 사유가 겹치면
        입력부족→소진없음→이력없음 순서.
