  "/equipment/{equipmentId}":
    get:
      tags:
        - Equipment
      operationId: getEquipmentDetail
      summary: 설비 상세 조회
      x-api-id: EQP-004
      x-requirement-ids:
        - FR0203
        - FR0704
      x-nfr-ids:
