  /overview/equipment-layout:
    get:
      tags:
        - Overview
      operationId: getEquipmentLayout
      summary: 공장 설비 배치도 조회
      x-api-id: OVW-001
      x-requirement-ids:
        - FR0701
      x-nfr-ids:
        - NFR03
        - NFR07
      x-interface-ids:
        - IFR04
      x-business-rule-ids:
        - BR-OVW-001
      x-test-ids:
        - TC-OVW-001-01
        - TC-OVW-001-02
      x-permissions:
        - ADMIN
        - USER
      parameters:
        - $ref: "#/components/parameters/LineId"
      responses:
        "200":
          description: 라인·공정 순서의 설비 배치와 상태 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentLayoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /overview/assembly-stop-forecast:
    get:
      tags:
        - Overview
      operationId: getAssemblyStopForecast
      summary: 조립 정지·복구·손실 예측 조회
      x-api-id: OVW-002
      x-requirement-ids:
