openapi: 3.0.3
info:
  title: STF Save The Factory API
  version: 2.0.0-draft
  description: |
    등속조인트 생산 공정 설비통합관제 시스템 API.
    요구사항정의서 1.0(2026-11-15), 기능 변경내역, 기능목록 수정본과
    dashboard_1 화면 시안을 기준으로 작성했다.
    실제 공정 수치와 화면 더미값은 계약값으로 확정하지 않는다.
servers:
  - url: /api/v1
    description: 사용자 REST API
tags:
  - {name: Auth, description: 로그인과 권한}
  - {name: Communication, description: 설비 통신 상태}
  - {name: Overview, description: 종합현황}
  - {name: Equipment, description: 설비 조회와 모니터링}
  - {name: Inventory, description: 재고와 조립 정지 예측}
  - {name: Alarm, description: 알람 조회와 처리}
  - {name: Part, description: 장착 부품과 교체}
  - {name: Statistics, description: 이력과 통계}
  - {name: MasterData, description: 설비관리 기준정보}
  - {name: SystemSetting, description: 시스템 판정과 계산 설정}
  - {name: SystemUser, description: 계정 관리}
  - {name: Kakao, description: 카카오톡 연결과 전송}
  - {name: Audit, description: 변경 이력}
  - {name: Duty, description: 알람 당번}
  - {name: Internal, description: Node-RED 내부 수집}
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인
      security: []
      x-api-id: AUTH-001
      x-requirement-ids: [FR0101]
      x-nfr-ids: [NFR01, NFR02]
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: [ANONYMOUS]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃과 현재 Access Token 폐기
      x-api-id: AUTH-002
      x-requirement-ids: [FR0104]
      x-nfr-ids: [NFR02]
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: &allPermissions [ADMIN, GENERAL]
      responses:
        '204': {description: 로그아웃 성공}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 로그인 사용자 정보 조회
      description: 최종 로그인 일시는 요구사항과 화면에 없어 응답하지 않는다.
      x-api-id: AUTH-003
      x-requirement-ids: [FR0105]
      x-nfr-ids: [NFR02, NFR06]
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUserResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /communications:
    get:
      tags: [Communication]
      operationId: getCommunications
      summary: 설비별 통신 현황 조회
      description: 화면 메뉴 위치는 미정이나 헤더에서 모든 사용자가 이동하므로 조회 권한은 ADMIN과 GENERAL로 제안한다.
      x-api-id: COM-001
      x-requirement-ids: [FR0203, FR0204]
      x-nfr-ids: [NFR03, NFR04]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/LineId'}
        - {$ref: '#/components/parameters/CommunicationStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200':
          description: 통신 집계와 설비별 통신 현황
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunicationPageResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /communications/summary:
    get:
      tags: [Communication]
      operationId: getCommunicationSummary
      summary: 헤더 통신 상태 조회
      x-api-id: COM-002
      x-requirement-ids: [FR0205]
      x-nfr-ids: [NFR03]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      responses:
        '200':
          description: 전체 정상, 일부 끊김 또는 전체 끊김 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommunicationSummaryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /overview/equipment-layout:
    get:
      tags: [Overview]
      operationId: getEquipmentLayout
      summary: 공장 설비 배치도 조회
      x-api-id: OVW-001
      x-requirement-ids: [FR0701]
      x-nfr-ids: [NFR03, NFR07]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/LineId'}
      responses:
        '200':
          description: 라인·공정 순서의 설비 배치와 상태 집계
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EquipmentLayoutResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /overview/assembly-stop-forecast:
    get:
      tags: [Overview]
      operationId: getAssemblyStopForecast
      summary: 조립 정지·복구·손실 예측 조회
      x-api-id: OVW-002
      x-requirement-ids: [FR0903, FR0904, FR0905, FR0906, FR0907]
      x-nfr-ids: [NFR03]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      responses:
        '200':
          description: 라인별 소진 예측과 대표 조립 정지 예측
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssemblyStopForecastResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /inventory:
    get:
      tags: [Inventory]
      operationId: getInventory
      summary: 라인별 현재 재고 조회
      x-api-id: INV-001
      x-requirement-ids: [FR0902]
      x-nfr-ids: [NFR03]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      responses:
        '200':
          description: 현재 재고와 생산·소비 속도
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /inventory/history:
    get:
      tags: [Inventory]
      operationId: getInventoryHistory
      summary: 재고 추이 조회
      x-api-id: INV-002
      x-requirement-ids: [FR0908]
      x-nfr-ids: []
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - name: lineIds
          in: query
          description: 미지정 시 전체 라인
          schema: {type: array, items: {$ref: '#/components/schemas/Identifier'}}
          style: form
          explode: false
      responses:
        '200':
          description: 시각별 라인 재고
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryHistoryResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}

  /lines:
    get:
      tags: [Equipment]
      operationId: getLines
      summary: 조회용 라인 목록
      x-api-id: EQP-001
      x-requirement-ids: [FR0701, FR0703, FR0801]
      x-nfr-ids: []
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      responses:
        '200':
          description: 표시 순서의 라인 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /lines/{lineId}/processes:
    get:
      tags: [Equipment]
      operationId: getLineProcesses
      summary: 라인의 공정 목록 조회
      x-api-id: EQP-002
      x-requirement-ids: [FR0703]
      x-nfr-ids: []
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/LineIdPath'}
      responses:
        '200':
          description: 공정 순서와 이상 설비 유무
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /processes/{processId}/equipment:
    get:
      tags: [Equipment]
      operationId: getProcessEquipment
      summary: 공정별 설비 목록 조회
      x-api-id: EQP-003
      x-requirement-ids: [FR0703]
      x-nfr-ids: [NFR03]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/ProcessIdPath'}
      responses:
        '200':
          description: 상태·이상 측정값·교체 임박 부품을 포함한 설비 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessEquipmentResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /equipment/{equipmentId}:
    get:
      tags: [Equipment]
      operationId: getEquipmentDetail
      summary: 설비 상세 조회
      x-api-id: EQP-004
      x-requirement-ids: [FR0203, FR0704]
      x-nfr-ids: [NFR03]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/EquipmentIdPath'}
      responses:
        '200':
          description: 기본정보, 현재 상태, 측정·상태·누적값, 사진
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EquipmentDetailResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /equipment/{equipmentId}/data-items:
    get:
      tags: [Equipment]
      operationId: getEquipmentDataItems
      summary: 설비 데이터 항목 목록 조회
      x-api-id: EQP-005
      x-requirement-ids: [FR0801]
      x-nfr-ids: []
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/EquipmentIdPath'}
      responses:
        '200':
          description: 항목과 현재값
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataItemListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /equipment/{equipmentId}/measurements:
    get:
      tags: [Equipment]
      operationId: getEquipmentMeasurements
      summary: 데이터 항목 추세 조회
      x-api-id: MEAS-001
      x-requirement-ids: [FR0802, FR0803, FR0804, FR0805]
      x-nfr-ids: [NFR03, NFR04]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/EquipmentIdPath'}
        - name: dataItemId
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Identifier'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: 시각별 값, 기준, 알람 시점, 통신 끊김 구간
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeasurementSeriesResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}

  /alarms:
    get:
      tags: [Alarm]
      operationId: getActiveAlarms
      summary: 종료되지 않은 알람 목록 조회
      x-api-id: ALM-001
      x-requirement-ids: [FR0502, FR0601, FR0602]
      x-nfr-ids: [NFR03, NFR06]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/LineId'}
        - {$ref: '#/components/parameters/EquipmentId'}
        - name: processStatus
          in: query
          schema: {$ref: '#/components/schemas/AlarmProcessStatus'}
        - name: grade
          in: query
          schema: {$ref: '#/components/schemas/AlarmGrade'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200':
          description: 발생 중/미확인 건수와 알람 페이지
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlarmPageResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /alarms/recent-closed:
    get:
      tags: [Alarm]
      operationId: getRecentClosedAlarms
      summary: 최근 종료 알람 조회
      x-api-id: ALM-002
      x-requirement-ids: [FR0612]
      x-nfr-ids: []
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - name: limit
          in: query
          description: 기본값과 최대값 추가 정의 필요
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: 최신 순 종료 알람
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecentClosedAlarmResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /alarms/{alarmId}:
    get:
      tags: [Alarm]
      operationId: getAlarmDetail
      summary: 알람 상세 조회
      x-api-id: ALM-003
      x-requirement-ids: [FR0603, FR0611]
      x-nfr-ids: [NFR06]
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      responses:
        '200':
          description: 알람 요약, 추세, 단계, 효과와 처리 기록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlarmDetailResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /alarms/{alarmId}/acknowledgement:
    patch:
      tags: [Alarm]
      operationId: acknowledgeAlarm
      summary: 알람 확인과 담당자 지정
      x-api-id: ALM-004
      x-requirement-ids: [FR0508, FR0604]
      x-nfr-ids: [NFR06]
      x-interface-ids: [IFR03, IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlarmAcknowledgementRequest'}
      responses:
        '200':
          description: 변경된 처리 상태와 확인/담당 정보
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlarmAcknowledgementResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/BusinessRuleViolation'}
  /alarms/{alarmId}/recommended-actions:
    get:
      tags: [Alarm]
      operationId: getRecommendedActions
      summary: 과거 효과 조치 조회
      x-api-id: ALM-005
      x-requirement-ids: [FR0605]
      x-nfr-ids: []
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      responses:
        '200':
          description: 효과 비율 순의 과거 조치
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendedActionResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /alarms/{alarmId}/actions:
    post:
      tags: [Alarm]
      operationId: createAlarmAction
      summary: 알람 조치 기록
      x-api-id: ALM-006
      x-requirement-ids: [FR0606, FR1103]
      x-nfr-ids: [NFR06, NFR09]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlarmActionRequest'}
      responses:
        '201':
          description: 조치 기록과 변경 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlarmActionResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /alarms/{alarmId}/false-positive:
    post:
      tags: [Alarm]
      operationId: reportFalsePositive
      summary: 오경보 신고와 종료
      x-api-id: ALM-007
      x-requirement-ids: [FR0607, FR0610]
      x-nfr-ids: [NFR06]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FalsePositiveRequest'}
      responses:
        '200':
          description: 오경보 처리 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlarmClosureResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/BusinessRuleViolation'}
  /alarms/{alarmId}/effect:
    get:
      tags: [Alarm]
      operationId: getAlarmEffect
      summary: 효과 확인 진행 상태 조회
      x-api-id: ALM-008
      x-requirement-ids: [FR0608, FR0609, FR0610]
      x-nfr-ids: [NFR03]
      x-interface-ids: [IFR04]
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      responses:
        '200':
          description: 목표/현재 생산 수와 대기·재발·완료 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlarmEffectResponse'}
        '404': {$ref: '#/components/responses/NotFound'}

  /alarm-histories:
    get:
      tags: [Statistics]
      operationId: getAlarmHistories
      summary: 종료 알람 이력 조회
      x-api-id: HST-001
      x-requirement-ids: [FR1201]
      x-nfr-ids: [NFR06]
      x-interface-ids: []
      x-business-rule-ids: []
      x-test-ids: []
      x-permissions: *allPermissions
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/LineId'}
        - {$ref: '#/components/parameters/EquipmentId'}
        - name: grade
          in: query
          schema: {$ref: '#/components/schemas/AlarmGrade'}
        - name: result
          in: query
          schema: {$ref: '#/components/schemas/AlarmResult'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
      responses:
        '200':
          description: 종료 알람 페이지
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlarmHistoryPageResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /equipment/{equipmentId}/fault-histories:
    get:
      tags: [Statistics]
