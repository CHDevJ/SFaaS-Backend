openapi: 3.0.3
info:
  title: STF Save The Factory API
  version: 1.0.0-draft
  description: |
    등속조인트 생산설비 통합관제 시스템 API 초안.
    요구사항 정의서, 시스템 아키텍처, STF 화면 프로토타입과 사용자 확정사항을 반영했다.
    LLM 연동은 보류사항이므로 실행 경로에 포함하지 않는다.
servers:
  - url: /api/v1
    description: 사용자 REST API
tags:
  - name: Auth
  - name: Overview
  - name: Equipment
  - name: Alarm
  - name: Inventory
  - name: Production
  - name: Part
  - name: Statistics
  - name: SystemUser
  - name: SystemMaster
  - name: SystemSetting
  - name: Kakao
  - name: Audit
  - name: Internal
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인
      description: 최종 로그인 일시는 저장하지 않으며 Refresh Token을 발급하지 않는다.
      security: []
      x-roles: [ANONYMOUS]
      x-requirement-ids: ["1.1", "1.2"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃
      x-roles: &allRoles [SYSTEM_ADMIN, MAINTENANCE, LINE_MANAGER]
      x-requirement-ids: ["1.3"]
      responses:
        '204': {description: 로그아웃 성공}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMyProfile
      summary: 내 정보 조회
      x-roles: *allRoles
      x-requirement-ids: ["1.4"]
      responses:
        '200':
          description: 내 정보. 최종 로그인 일시는 포함하지 않는다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me/password:
    put:
      tags: [Auth]
      operationId: changeMyPassword
      summary: 내 비밀번호 변경
      x-roles: *allRoles
      x-requirement-ids: ["1.5"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '204': {description: 변경 성공. 현재 토큰 폐기 후 재로그인 필요}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /communications:
    get:
      tags: [Equipment]
      operationId: getCommunicationStatus
      summary: 설비 통신 상태 조회
      x-roles: *allRoles
      x-requirement-ids: ["2.2", "2.3", "2.4"]
      parameters:
        - {$ref: '#/components/parameters/LineId'}
        - name: status
          in: query
          schema: {type: string, enum: [CONNECTED, DISCONNECTED]}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /overview:
    get:
      tags: [Overview]
      operationId: getOverview
      summary: 종합현황 조회
      x-roles: *allRoles
      x-requirement-ids: ["3.1", "3.2", "7.1", "9.1", "10.1"]
      responses:
        '200':
          description: 설비 상태 집계, 라인 현황, 발생 알람, 재고와 생산 요약
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverviewEnvelope'}
  /equipment-layout:
    get:
      tags: [Equipment]
      operationId: getEquipmentLayout
      summary: 공장·라인 설비 배치 조회
      x-roles: *allRoles
      x-requirement-ids: ["7.1", "7.2"]
      parameters:
        - {$ref: '#/components/parameters/LineId'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
  /lines/{lineId}/equipment:
    get:
      tags: [Equipment]
      operationId: getLineEquipment
      summary: 라인별 설비 조회
      x-roles: *allRoles
      x-requirement-ids: ["7.2"]
      parameters:
        - {$ref: '#/components/parameters/LineIdPath'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/EquipmentStatus'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/NotFound'}
  /equipment/{equipmentId}:
    get:
      tags: [Equipment]
      operationId: getEquipmentDetail
      summary: 설비 상세 조회
      x-roles: *allRoles
      x-requirement-ids: ["7.3", "7.4"]
      parameters:
        - {$ref: '#/components/parameters/EquipmentIdPath'}
      responses:
        '200':
          description: 설비 기본정보, 상태, 측정값, 통신, 미종료 알람
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EquipmentEnvelope'}
        '404': {$ref: '#/components/responses/NotFound'}
  /equipment/{equipmentId}/measurements:
    get:
      tags: [Equipment]
      operationId: getEquipmentMeasurements
      summary: 설비 측정 추세 조회
      x-roles: *allRoles
      x-requirement-ids: ["8.1", "8.2", "8.3", "8.4", "8.5"]
      parameters:
        - {$ref: '#/components/parameters/EquipmentIdPath'}
        - name: dataItemIds
          in: query
          required: true
          schema: {type: array, items: {type: string, format: uuid}}
          style: form
          explode: false
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - name: interval
          in: query
          schema: {type: string, enum: [RAW, MINUTE, HOUR], default: MINUTE}
      responses:
        '200':
          description: 항목별 시계열, 최소·평균·최대, 임계값
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeasurementSeriesEnvelope'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
  /alarms:
    get:
      tags: [Alarm]
      operationId: getAlarms
      summary: 알람 목록 조회
      x-roles: *allRoles
      x-requirement-ids: ["4.1", "5.1", "6.1"]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - {$ref: '#/components/parameters/LineId'}
        - name: equipmentId
          in: query
          schema: {type: string, format: uuid}
        - name: grade
          in: query
          schema: {$ref: '#/components/schemas/AlarmGrade'}
        - name: processStatus
          in: query
          schema: {$ref: '#/components/schemas/AlarmProcessStatus'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200': {$ref: '#/components/responses/PagedSuccess'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /alarms/{alarmId}:
    get:
      tags: [Alarm]
      operationId: getAlarmDetail
      summary: 알람 상세 조회
      x-roles: *allRoles
      x-requirement-ids: ["6.1", "6.2"]
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      responses:
        '200':
          description: 알람, 측정값, 처리단계, 조치이력, 효과확인
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlarmEnvelope'}
        '404': {$ref: '#/components/responses/NotFound'}
  /alarms/{alarmId}/acknowledgement:
    patch:
      tags: [Alarm]
      operationId: acknowledgeAlarm
      summary: 알람 확인·담당자 지정
      x-roles: *allRoles
      x-requirement-ids: ["6.2", "6.3"]
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeUserId]
              properties:
                assigneeUserId: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /alarms/{alarmId}/recommended-actions:
    get:
      tags: [Alarm]
      operationId: getRecommendedActions
      summary: 과거 유사 조치 조회
      description: DB 기반 결과만 필수이며 LLM 요약은 보류한다.
      x-roles: *allRoles
      x-requirement-ids: ["6.4"]
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/NotFound'}
  /alarms/{alarmId}/actions:
    post:
      tags: [Alarm]
      operationId: recordAlarmAction
      summary: 알람 조치 기록
      x-roles: *allRoles
      x-requirement-ids: ["6.5", "6.6"]
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlarmActionRequest'}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /alarms/{alarmId}/false-positive:
    post:
      tags: [Alarm]
      operationId: closeAlarmAsFalsePositive
      summary: 오경보 처리
      x-roles: *allRoles
      x-requirement-ids: ["6.7"]
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '409': {$ref: '#/components/responses/Conflict'}
  /alarms/{alarmId}/effect:
    get:
      tags: [Alarm]
      operationId: getAlarmEffect
      summary: 조치 효과확인 조회
      x-roles: *allRoles
      x-requirement-ids: ["6.8", "6.9", "6.10", "6.11"]
      parameters:
        - {$ref: '#/components/parameters/AlarmIdPath'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/NotFound'}
  /alarm-histories:
    get:
      tags: [Alarm]
      operationId: getAlarmHistories
      summary: 알람 처리 이력 조회
      x-roles: *allRoles
      x-requirement-ids: ["6.12", "12.1"]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/LineId'}
      responses:
        '200': {$ref: '#/components/responses/PagedSuccess'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /inventory:
    get:
      tags: [Inventory]
      operationId: getInventoryStatus
      summary: 라인별 재고·정지예측 조회
      x-roles: *allRoles
      x-requirement-ids: ["9.1", "9.2", "9.3", "9.4", "9.5", "9.6", "9.7"]
      parameters:
        - {$ref: '#/components/parameters/LineId'}
      responses:
        '200':
          description: 재고, 생산·소비율, 남은시간, 정지·복구예상, 여유시간, 위험, 손실
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryEnvelope'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/history:
    get:
      tags: [Inventory]
      operationId: getInventoryHistory
      summary: 재고 추이 조회
      x-roles: *allRoles
      x-requirement-ids: ["9.8"]
      parameters:
        - name: lineIds
          in: query
          schema: {type: array, items: {type: string, format: uuid}}
          style: form
          explode: false
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /production/today:
    get:
      tags: [Production]
      operationId: getTodayProduction
      summary: 금일 생산현황 조회
      x-roles: *allRoles
      x-requirement-ids: ["10.1"]
      responses:
        '200':
          description: 완성품 수, 목표, 달성률, 계획대비, 라인별 수
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductionEnvelope'}
        '409': {$ref: '#/components/responses/Conflict'}
  /production/hourly:
    get:
      tags: [Production]
      operationId: getHourlyProduction
      summary: 시간대별 생산현황 조회
      x-roles: *allRoles
      x-requirement-ids: ["10.2"]
      parameters:
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /equipment/{equipmentId}/parts:
    get:
      tags: [Part]
      operationId: getEquipmentParts
      summary: 설비 부품 교체현황 조회
      x-roles: *allRoles
      x-requirement-ids: ["11.1", "11.2"]
      parameters:
        - {$ref: '#/components/parameters/EquipmentIdPath'}
        - name: groupBy
          in: query
          schema: {type: string, enum: [EQUIPMENT, PART], default: EQUIPMENT}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/NotFound'}
  /equipment/{equipmentId}/parts/{partId}/replacements:
    post:
      tags: [Part]
      operationId: createPartReplacement
      summary: 부품 교체 등록
      x-roles: *allRoles
      x-requirement-ids: ["11.3"]
      parameters:
        - {$ref: '#/components/parameters/EquipmentIdPath'}
        - {$ref: '#/components/parameters/PartIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartReplacementRequest'}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [Part]
      operationId: getPartReplacementHistory
      summary: 부품 교체 이력 조회
      x-roles: *allRoles
      x-requirement-ids: ["11.4"]
      parameters:
        - {$ref: '#/components/parameters/EquipmentIdPath'}
        - {$ref: '#/components/parameters/PartIdPath'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200': {$ref: '#/components/responses/PagedSuccess'}
  /statistics/alarms:
    get:
      tags: [Statistics]
      operationId: getAlarmStatistics
      summary: 알람 대응 통계 조회
      x-roles: *allRoles
      x-requirement-ids: ["12.2", "12.3", "12.4"]
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/LineId'}
        - name: equipmentId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /statistics/equipment:
    get:
      tags: [Statistics]
      operationId: getEquipmentStatistics
      summary: 설비 가동·고장 통계 조회
      x-roles: *allRoles
      x-requirement-ids: ["12.5", "12.6", "12.7", "12.8"]
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/LineId'}
        - name: sortBy
          in: query
          schema: {type: string, enum: [FAILURE_COUNT, DOWNTIME, MTTR, LOSS]}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /statistics/losses:
    get:
      tags: [Statistics]
      operationId: getLossStatistics
      summary: 생산손실 통계 조회
      x-roles: *allRoles
      x-requirement-ids: ["12.9"]
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '409': {$ref: '#/components/responses/Conflict'}
  /statistics/comparison:
    get:
      tags: [Statistics]
      operationId: getStatisticsComparison
      summary: 기간·동일공정 설비 비교
      x-roles: *allRoles
      x-requirement-ids: ["12.10"]
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - name: processType
          in: query
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /statistics/export:
    get:
      tags: [Statistics]
      operationId: exportStatistics
      summary: 통계 CSV 내보내기
      x-roles: *allRoles
      x-requirement-ids: ["12.11"]
      parameters:
        - name: type
          in: query
          required: true
          schema: {type: string, enum: [ALARM, FAILURE]}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/LineId'}
      responses:
        '200':
          description: UTF-8 BOM CSV
          content:
            text/csv:
              schema: {type: string, format: binary}
        '413':
          description: 내보내기 허용건수 초과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /system/users:
    get:
      tags: [SystemUser]
      operationId: getUsers
      summary: 등록 사용자 목록 조회
      x-roles: &adminOnly [SYSTEM_ADMIN]
      x-requirement-ids: ["1.4", "14.3"]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: name
          in: query
          schema: {type: string}
        - name: role
          in: query
          schema: {$ref: '#/components/schemas/UserRole'}
        - name: accountStatus
          in: query
          schema: {$ref: '#/components/schemas/AccountStatus'}
      responses:
        '200':
          description: 사용자 목록. 최종 로그인 일시는 포함하지 않는다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagedEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [SystemUser]
      operationId: createUser
      summary: 사용자 등록
      x-roles: *adminOnly
      x-requirement-ids: ["14.3"]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreateRequest'}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /system/users/{userId}:
    get:
      tags: [SystemUser]
      operationId: getUser
      summary: 사용자 상세 조회
      x-roles: *adminOnly
      x-requirement-ids: ["14.3"]
      parameters:
        - {$ref: '#/components/parameters/UserIdPath'}
      responses:
        '200':
          description: 사용자 상세. 최종 로그인 일시는 포함하지 않는다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserEnvelope'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [SystemUser]
      operationId: updateUser
      summary: 사용자 기본정보 수정
      x-roles: *adminOnly
      x-requirement-ids: ["14.3"]
      parameters:
        - {$ref: '#/components/parameters/UserIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '404': {$ref: '#/components/responses/NotFound'}
  /system/users/{userId}/role:
    patch:
      tags: [SystemUser]
      operationId: changeUserRole
      summary: 사용자 역할 변경
      x-roles: *adminOnly
      x-requirement-ids: ["14.3"]
      parameters:
        - {$ref: '#/components/parameters/UserIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {$ref: '#/components/schemas/UserRole'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '409': {$ref: '#/components/responses/Conflict'}
  /system/users/{userId}/status:
    patch:
      tags: [SystemUser]
      operationId: changeUserStatus
      summary: 사용자 사용상태 변경
      x-roles: *adminOnly
      x-requirement-ids: ["14.3"]
      parameters:
        - {$ref: '#/components/parameters/UserIdPath'}
      requestBody:
        required: true
        content:
