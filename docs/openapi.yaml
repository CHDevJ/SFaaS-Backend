components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authorization 헤더의 30분 만료 Access Token. Refresh Token은 HttpOnly Secure SameSite=Strict 쿠키로 별도 관리한다.
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: Node-RED 내부 수집 전용 키. 90일마다 회전하며 현재 키와 직전 키를 24시간 중첩 허용한다.
      x-proposed: true
  parameters:
    Page:
      name: page
      in: query
      description: 0부터 시작
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      description: 페이지 크기
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Sort:
      name: sort
      in: query
      description: '`field,asc` 또는 `field,desc`'
      schema: {type: string, example: 'occurredAt,desc'}
    From:
      name: from
      in: query
      required: true
      schema: {type: string, format: date-time, example: '2026-11-16T00:00:00+09:00'}
    To:
      name: to
      in: query
      required: true
      schema: {type: string, format: date-time, example: '2026-11-16T23:59:59+09:00'}
    FromOptional:
      name: from
      in: query
      schema: {type: string, format: date-time}
    ToOptional:
      name: to
      in: query
      schema: {type: string, format: date-time}
    LineId:
      name: lineId
      in: query
      schema: {$ref: '#/components/schemas/Identifier'}
    EquipmentId:
      name: equipmentId
      in: query
      schema: {$ref: '#/components/schemas/Identifier'}
    CommunicationStatus:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/CommunicationStatus'}
    LineIdPath:
      name: lineId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ProcessIdPath:
      name: processId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    EquipmentIdPath:
      name: equipmentId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    AlarmIdPath:
      name: alarmId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    PartIdPath:
      name: partId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    DataItemIdPath:
      name: dataItemId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    SignupRequestIdPath:
      name: requestId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ScheduleIdPath:
      name: scheduleId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
  responses:
    ValidationError:
      description: 요청값 형식 또는 필수값 오류
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, error: {code: VALIDATION_ERROR, message: 입력값을 확인해 주세요.}}
    Unauthorized:
      description: 로그인 또는 토큰 오류
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, error: {code: AUTH_TOKEN_INVALID, message: 다시 로그인해 주세요.}}
    Forbidden:
      description: 접근 권한 부족
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {success: false, error: {code: AUTH_PERMISSION_DENIED, message: 접근 권한이 없습니다.}}
    NotFound:
      description: 요청한 데이터 없음
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: 중복 또는 현재 상태 충돌
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    BusinessRuleViolation:
      description: 업무규칙 위반
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
