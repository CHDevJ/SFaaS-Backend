components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 30분 Access Token. Refresh Token과 브라우저 영속 저장을 사용하지 않는다.
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Node-RED 전용 내부 토큰. 운영 시 IP 제한 또는 mTLS 병행 권장.
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Sort:
      name: sort
      in: query
      description: "field,asc 또는 field,desc"
      schema: {type: string}
    From:
      name: from
      in: query
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      schema: {type: string, format: date-time}
    LineId:
      name: lineId
      in: query
      schema: {type: string, format: uuid}
    LineIdPath:
      name: lineId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EquipmentIdPath:
      name: equipmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AlarmIdPath:
      name: alarmId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PartIdPath:
      name: partId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DataItemIdPath:
      name: dataItemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ThresholdIdPath:
      name: thresholdId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Success:
      description: 성공
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SuccessEnvelope'}
    Created:
      description: 생성 성공
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SuccessEnvelope'}
    PagedSuccess:
      description: 페이지 조회 성공
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PagedEnvelope'}
    ValidationError:
      description: 요청값 검증 실패
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: 인증 필요 또는 토큰 만료
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: 접근 권한 없음
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: 자원 없음
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: 자원 상태와 요청 작업 충돌
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    UserRole:
      type: string
      enum: [SYSTEM_ADMIN, MAINTENANCE, LINE_MANAGER]
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    EquipmentStatus:
      type: string
      enum: [RUNNING, IDLE, WARNING, FAULT, OFFLINE]
    AlarmGrade:
      type: string
      enum: [WARNING, CRITICAL]
    AlarmValueStatus:
      type: string
      enum: [OUT_OF_RANGE, RECOVERED]
    AlarmProcessStatus:
      type: string
      enum: [UNACKNOWLEDGED, ACKNOWLEDGED, ACTION_RECORDED, EFFECT_CHECKING, CLOSED]
    EffectStatus:
      type: string
      enum: [WAITING, IN_PROGRESS, PASSED, FAILED]
    ActivationStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginId, password]
      properties:
        loginId: {type: string, minLength: 4, maxLength: 50, example: admin01}
        password: {type: string, format: password, minLength: 8, maxLength: 64}
    LoginResponseEnvelope:
      type: object
      required: [success, data, timestamp]
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          required: [accessToken, tokenType, expiresInSeconds, user]
          properties:
            accessToken: {type: string}
            tokenType: {type: string, example: Bearer}
            expiresInSeconds: {type: integer, example: 1800}
            user: {$ref: '#/components/schemas/User'}
        timestamp: {type: string, format: date-time}
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, format: password}
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: 영문·숫자·특수문자를 각각 1개 이상 포함
    User:
      type: object
      description: 최종 로그인 일시 필드는 의도적으로 존재하지 않는다.
      required: [userId, loginId, name, role, accountStatus, createdAt, updatedAt]
      properties:
        userId: {type: string, format: uuid}
        loginId: {type: string}
        name: {type: string}
        role: {$ref: '#/components/schemas/UserRole'}
        accountStatus: {$ref: '#/components/schemas/AccountStatus'}
        phoneNumber: {type: string, nullable: true}
        email: {type: string, format: email, nullable: true}
        kakaoConnected: {type: boolean, default: false}
        assignedLineIds:
          type: array
          items: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UserEnvelope:
      type: object
      required: [success, data, timestamp]
      properties:
        success: {type: boolean, example: true}
        data: {$ref: '#/components/schemas/User'}
        timestamp: {type: string, format: date-time}
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [loginId, name, role, password]
      properties:
        loginId: {type: string, minLength: 4, maxLength: 50, pattern: '^[A-Za-z0-9._-]+$'}
        name: {type: string, minLength: 1, maxLength: 50}
        role: {$ref: '#/components/schemas/UserRole'}
        password: {type: string, format: password, minLength: 8, maxLength: 64}
        phoneNumber: {type: string, maxLength: 20}
        email: {type: string, format: email}
        assignedLineIds:
          type: array
          items: {type: string, format: uuid}
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        phoneNumber: {type: string, maxLength: 20, nullable: true}
        email: {type: string, format: email, nullable: true}
        assignedLineIds:
          type: array
          items: {type: string, format: uuid}
    EquipmentSummary:
      type: object
      required: [equipmentId, equipmentCode, name, lineId, status, lastReceivedAt]
      properties:
        equipmentId: {type: string, format: uuid}
        equipmentCode: {type: string}
        name: {type: string}
        lineId: {type: string, format: uuid}
        processOrder: {type: integer}
        status: {$ref: '#/components/schemas/EquipmentStatus'}
        lastReceivedAt: {type: string, format: date-time, nullable: true}
        openAlarmCount: {type: integer, minimum: 0}
    OverviewEnvelope:
      type: object
      required: [success, data, timestamp]
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          properties:
            statusCounts:
              type: object
              additionalProperties: {type: integer, minimum: 0}
            equipment:
              type: array
              items: {$ref: '#/components/schemas/EquipmentSummary'}
            openAlarms:
              type: array
              items: {$ref: '#/components/schemas/Alarm'}
            inventory:
              type: array
              items: {$ref: '#/components/schemas/InventoryStatus'}
            production: {$ref: '#/components/schemas/ProductionStatus'}
        timestamp: {type: string, format: date-time}
    EquipmentEnvelope:
      type: object
      required: [success, data, timestamp]
      properties:
        success: {type: boolean}
        data:
          allOf:
            - {$ref: '#/components/schemas/EquipmentSummary'}
            - type: object
              properties:
                type: {type: string}
                serialNumber: {type: string}
                floor: {type: string}
                communicationType: {type: string, enum: [MODBUS_TCP, OPC_UA, MQTT]}
                measurements:
                  type: array
                  items: {$ref: '#/components/schemas/MeasurementPoint'}
                openAlarms:
                  type: array
                  items: {$ref: '#/components/schemas/Alarm'}
        timestamp: {type: string, format: date-time}
    MeasurementPoint:
      type: object
      required: [dataItemId, value, unit, measuredAt]
      properties:
        dataItemId: {type: string, format: uuid}
        dataItemName: {type: string}
        value: {type: number, format: double}
        unit: {type: string}
        measuredAt: {type: string, format: date-time}
    MeasurementSeriesEnvelope:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items:
            type: object
            properties:
              dataItemId: {type: string, format: uuid}
              name: {type: string}
              unit: {type: string}
              warningThreshold: {type: number, nullable: true}
              criticalThreshold: {type: number, nullable: true}
              minimum: {type: number}
              average: {type: number}
              maximum: {type: number}
              points:
                type: array
                items:
                  type: object
                  properties:
                    measuredAt: {type: string, format: date-time}
                    value: {type: number}
        timestamp: {type: string, format: date-time}
    Alarm:
      type: object
      required: [alarmId, equipmentId, dataItemId, grade, valueStatus, processStatus, occurredAt]
      properties:
        alarmId: {type: string, format: uuid}
        equipmentId: {type: string, format: uuid}
        equipmentName: {type: string}
        dataItemId: {type: string, format: uuid}
        dataItemName: {type: string}
        grade: {$ref: '#/components/schemas/AlarmGrade'}
        valueStatus: {$ref: '#/components/schemas/AlarmValueStatus'}
        processStatus: {$ref: '#/components/schemas/AlarmProcessStatus'}
        measuredValue: {type: number}
        thresholdValue: {type: number}
        unit: {type: string}
        occurredAt: {type: string, format: date-time}
        acknowledgedAt: {type: string, format: date-time, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
        assigneeUserId: {type: string, format: uuid, nullable: true}
        version: {type: integer, format: int64}
    AlarmEnvelope:
      type: object
      properties:
        success: {type: boolean}
        data: {$ref: '#/components/schemas/Alarm'}
        timestamp: {type: string, format: date-time}
    AlarmActionRequest:
      type: object
      additionalProperties: false
      required: [actionContent]
      properties:
        actionContent: {type: string, minLength: 1, maxLength: 2000}
        actionAt: {type: string, format: date-time}
        startEffectCheck: {type: boolean, default: true}
    InventoryStatus:
      type: object
      properties:
        lineId: {type: string, format: uuid}
        currentQuantity: {type: integer, minimum: 0}
        maximumQuantity: {type: integer, minimum: 0}
        productionPerMinute: {type: number, minimum: 0}
        consumptionPerMinute: {type: number, minimum: 0}
        remainingMinutes: {type: number, nullable: true}
        stopForecastAt: {type: string, format: date-time, nullable: true}
        recoveryForecastAt: {type: string, format: date-time, nullable: true}
        marginMinutes: {type: number, nullable: true}
        risk: {type: string, enum: [SAFE, WARNING, DANGER]}
        expectedLossAmount: {type: number, minimum: 0}
        maintained: {type: boolean}
    InventoryEnvelope:
      type: object
      properties:
        success: {type: boolean}
        data:
          type: array
          items: {$ref: '#/components/schemas/InventoryStatus'}
        timestamp: {type: string, format: date-time}
    ProductionStatus:
      type: object
      properties:
        actualQuantity: {type: integer, minimum: 0}
        targetQuantity: {type: integer, minimum: 0}
        achievementRate: {type: number, nullable: true}
        planDifference: {type: integer}
    ProductionEnvelope:
      type: object
      properties:
        success: {type: boolean}
        data: {$ref: '#/components/schemas/ProductionStatus'}
        timestamp: {type: string, format: date-time}
    PartReplacementRequest:
      type: object
      additionalProperties: false
      required: [replacedAt, reason, workContent]
      properties:
        replacedAt: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 500}
        workContent: {type: string, minLength: 1, maxLength: 2000}
    EquipmentWriteRequest:
      type: object
      additionalProperties: false
      required: [equipmentCode, name, type, lineId, processOrder, communicationType]
      properties:
        equipmentCode: {type: string, minLength: 1, maxLength: 50, pattern: '^[A-Z0-9_-]+$'}
        name: {type: string, minLength: 1, maxLength: 100}
        type: {type: string, minLength: 1, maxLength: 100}
        serialNumber: {type: string, maxLength: 100}
        floor: {type: string, maxLength: 50}
        lineId: {type: string, format: uuid}
        processOrder: {type: integer, minimum: 1}
        managerUserId: {type: string, format: uuid, nullable: true}
        communicationType: {type: string, enum: [MODBUS_TCP, OPC_UA, MQTT]}
        layoutX: {type: number, format: double}
        layoutY: {type: number, format: double}
        layoutZ: {type: number, format: double}
    ActivationRequest:
      type: object
      additionalProperties: false
      required: [activationStatus]
      properties:
        activationStatus: {$ref: '#/components/schemas/ActivationStatus'}
    LineWriteRequest:
      type: object
      additionalProperties: false
      required: [name, displayOrder]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        displayOrder: {type: integer, minimum: 1}
        activationStatus: {$ref: '#/components/schemas/ActivationStatus'}
        equipmentPositions:
          type: array
          items:
            type: object
            required: [equipmentId, processOrder]
            properties:
              equipmentId: {type: string, format: uuid}
              processOrder: {type: integer, minimum: 1}
              layoutX: {type: number}
              layoutY: {type: number}
              layoutZ: {type: number}
    DataItemWriteRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, dataItemCode, name, unit, collectionIntervalSeconds, decimalPlaces]
      properties:
        equipmentId: {type: string, format: uuid}
        dataItemCode: {type: string, minLength: 1, maxLength: 50, pattern: '^[A-Z0-9_-]+$'}
        name: {type: string, minLength: 1, maxLength: 100}
        unit: {type: string, minLength: 1, maxLength: 20}
        collectionIntervalSeconds: {type: integer, minimum: 1, maximum: 3600, default: 2}
        decimalPlaces: {type: integer, minimum: 0, maximum: 6, default: 2}
        activationStatus: {$ref: '#/components/schemas/ActivationStatus'}
    ThresholdWriteRequest:
      type: object
      additionalProperties: false
      required: [direction, warningThreshold, criticalThreshold]
      properties:
        direction: {type: string, enum: [UPPER, LOWER]}
        warningThreshold: {type: number, format: double}
        criticalThreshold: {type: number, format: double}
    PartWriteRequest:
      type: object
      additionalProperties: false
      required: [equipmentId, name, specification, managementNumber, managementBasis, replacementThreshold]
      properties:
        equipmentId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 100}
        specification: {type: string, minLength: 1, maxLength: 200}
        managementNumber: {type: string, minLength: 1, maxLength: 50}
        managementBasis: {type: string, enum: [OPERATING_HOURS, ELAPSED_DAYS]}
        replacementThreshold: {type: integer, minimum: 1}
        activationStatus: {$ref: '#/components/schemas/ActivationStatus'}
    JudgementSettings:
      type: object
      additionalProperties: false
      required:
        - communicationTimeoutSeconds
        - unacknowledgedReminderMinutes
        - effectTargetCount
        - consecutiveThresholdCount
        - inventoryWarningMinutes
        - inventoryDangerMinutes
      properties:
        communicationTimeoutSeconds: {type: integer, minimum: 5, maximum: 300, default: 15}
        unacknowledgedReminderMinutes: {type: integer, minimum: 1, maximum: 1440, default: 5}
        effectTargetCount: {type: integer, minimum: 1, maximum: 1000, default: 20}
        consecutiveThresholdCount: {type: integer, minimum: 1, maximum: 20, default: 3}
        inventoryWarningMinutes: {type: integer, minimum: 1}
        inventoryDangerMinutes: {type: integer, minimum: 1}
    CalculationSettings:
      type: object
      additionalProperties: false
      required: [hourlyProductionQuantity, productUnitPrice, dailyProductionTarget, lines]
      properties:
        hourlyProductionQuantity: {type: number, minimum: 0}
        productUnitPrice: {type: number, minimum: 0}
        dailyProductionTarget: {type: integer, minimum: 0}
        lines:
          type: array
          items:
            type: object
            required: [lineId, maximumInventory, consumptionPerMinute, estimatedRepairMinutes]
            properties:
              lineId: {type: string, format: uuid}
              maximumInventory: {type: integer, minimum: 0}
              consumptionPerMinute: {type: number, minimum: 0}
              estimatedRepairMinutes: {type: integer, minimum: 0}
    MeasurementIngestionRequest:
      type: object
      additionalProperties: false
      required: [messageId, equipmentCode, dataItemCode, value, unit, measuredAt]
      properties:
        messageId: {type: string, format: uuid}
        equipmentCode: {type: string}
        dataItemCode: {type: string}
        value: {type: number, format: double}
        unit: {type: string}
        measuredAt: {type: string, format: date-time}
    HeartbeatIngestionRequest:
      type: object
      additionalProperties: false
      required: [messageId, equipmentCode, sentAt]
      properties:
        messageId: {type: string, format: uuid}
        equipmentCode: {type: string}
        sentAt: {type: string, format: date-time}
    ProductionEventIngestionRequest:
      type: object
      additionalProperties: false
      required: [messageId, lineCode, equipmentCode, eventType, quantity, occurredAt]
      properties:
        messageId: {type: string, format: uuid}
        lineCode: {type: string}
        equipmentCode: {type: string}
        eventType: {type: string, enum: [GOOD_UNIT_COMPLETED, SCRAP_UNIT, INVENTORY_ADJUSTED]}
        quantity: {type: integer, minimum: 1}
        occurredAt: {type: string, format: date-time}
    SuccessEnvelope:
      type: object
      required: [success, data, timestamp]
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          additionalProperties: true
        timestamp: {type: string, format: date-time}
        requestId: {type: string, format: uuid}
    PagedEnvelope:
      type: object
      required: [success, data, timestamp]
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          required: [content, page, size, totalElements, totalPages]
          properties:
            content:
              type: array
              items: {type: object, additionalProperties: true}
            page: {type: integer, minimum: 0}
            size: {type: integer, minimum: 1}
            totalElements: {type: integer, format: int64, minimum: 0}
            totalPages: {type: integer, minimum: 0}
        timestamp: {type: string, format: date-time}
        requestId: {type: string, format: uuid}
    ErrorResponse:
      type: object
      required: [success, error, timestamp]
      properties:
        success: {type: boolean, example: false}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: VALIDATION_FAILED}
            message: {type: string, example: 요청값을 확인해 주세요.}
            fieldErrors:
              type: array
              items:
                type: object
                properties:
                  field: {type: string}
                  reason: {type: string}
        timestamp: {type: string, format: date-time}
        requestId: {type: string, format: uuid}
