services:
  mysql:
    image: 'mysql:8.4'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stf}
      MYSQL_USER: ${MYSQL_USER:-stf_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stf_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
